# Spring Boot Application Configuration - RentEase PG & Room Finder
spring.application.name=RentEase-API
server.port=${PORT:8080}

# Default Database: Embedded H2 with MySQL Compatibility Mode (Zero-Config Out-of-the-Box)
spring.datasource.url=jdbc:h2:mem:renteasedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console for Inspecting Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Logging Configuration
logging.level.com.rentease=INFO
logging.level.org.springframework.web=INFO
