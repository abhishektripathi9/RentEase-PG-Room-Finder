# Render Blueprint Specification for RentEase Full-Stack Portal
services:
  # 1. Spring Boot Java Backend (Docker Web Service)
  - type: web
    name: rentease-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/properties/featured
    envVars:
      - key: PORT
        value: 8080

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: rentease-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rentease-backend.onrender.com/api
